name: Deploy Sandbox, Grapevine

on:
    push:
        branches:
            - main

env:
    GRAPEVINE_DOMAIN: ${{ vars.GRAPEVINE_DOMAIN }}
    WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
    WEBAUTHN_RP_NAME: Sandbox, Grapevine
    VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
    VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
    WORKER_CPU_MS: ${{ vars.WORKER_CPU_MS }}
    GRAPEVINE_SUMMARY_CRON: "0 * * * *"
    GRAPEVINE_TIMEZONE: Europe/Amsterdam
    GRAPEVINE_SUMMARY_LOCAL_HOUR: 9
    GRAPEVINE_SUMMARY_PERIOD_DAYS: 7
    OPENROUTER_BASE_URL: ""
    OPENROUTER_CHAT_COMPLETIONS_URL: ""
    OPENROUTER_SUMMARY_MODEL: openai/gpt-4.1-mini
    OPENROUTER_QUERY_MODEL: openai/gpt-4.1-mini
    OPENROUTER_MAX_INPUT_MESSAGES: 80
    OPENROUTER_MAX_OUTPUT_TOKENS: 900
    GRAPEVINE_MAX_SOURCE_MESSAGES: 240
    GRAPEVINE_MAX_SUMMARY_SOURCE_MESSAGES: 500
    GRAPEVINE_MAX_CHUNKS: 4
    GRAPEVINE_AI_CONTEXT_MESSAGE_CHARACTERS: 2000
    GRAPEVINE_MAX_MESSAGE_CHARACTERS: 5000
    GRAPEVINE_MAX_QUESTION_CHARACTERS: 1200
    GRAPEVINE_MAX_FILTER_IDS: 50
    GRAPEVINE_DAILY_RECORDING_MINUTES: 60
    GRAPEVINE_DAILY_MESSAGE_LIMIT: 5
    GRAPEVINE_DAILY_QUESTION_LIMIT: 10
    WORKERS_AI_TRANSCRIPTION_MODEL: "@cf/openai/whisper-large-v3-turbo"
    WORKERS_AI_TRANSCRIPTION_LANGUAGE: ""
    WORKERS_AI_TRANSCRIPTION_INITIAL_PROMPT: Sandbox, Grapevine member voice update.
    WORKERS_AI_TRANSCRIPTION_MAX_AUDIO_BYTES: 10000000
    WORKERS_AI_TRANSCRIPTION_MIN_SECONDS_PER_MEGABYTE: 60
    VITE_TRANSCRIPTION_MODEL: onnx-community/whisper-small
    VITE_TRANSCRIPTION_DEVICE: auto
    VITE_TRANSCRIPTION_DTYPE: q8
    VITE_TRANSCRIPTION_MAX_AUDIO_BYTES: 10000000
    SESSION_TTL_DAYS: 30
    DATA_RETENTION_POLICY: indefinite
    LOG_LEVEL: info
    D1_DATABASE_NAME: sandbox-grapevine
    D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Check deploy configuration
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
              run: |
                  if [ -z "${D1_DATABASE_ID}" ] \
                      || [ "${D1_DATABASE_ID}" = "replace-with-cloudflare-d1-database-id" ]; then
                      echo "::error::Set D1_DATABASE_ID to the production D1 database id."
                      exit 1
                  fi

                  if [ -z "${CLOUDFLARE_API_TOKEN}" ] \
                      || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
                      echo "::error::Set the Cloudflare deploy secrets before deploying."
                      exit 1
                  fi

                  if [ -z "${OPENROUTER_API_KEY}" ] \
                      || [ -z "${SESSION_SECRET}" ]; then
                      echo "::error::Set the Worker runtime secrets before deploying."
                      exit 1
                  fi

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Verify
              run: |
                  npm run lint:check
                  npm test

            - name: Build
              run: npm run build

            - name: Render Wrangler config
              run: npm run deploy:config

            - name: Prepare Worker secrets
              env:
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
                  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
                  WORKER_SECRETS_PATH: ${{ runner.temp }}/worker-secrets.json
              run: |
                  node <<'NODE'
                  const { chmodSync, writeFileSync } = require( `node:fs` )

                  const worker_secrets_path = process.env.WORKER_SECRETS_PATH
                  const worker_secrets = {
                      OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY,
                      SESSION_SECRET: process.env.SESSION_SECRET,
                  }
                  if( process.env.VAPID_PRIVATE_KEY ) worker_secrets.VAPID_PRIVATE_KEY = process.env.VAPID_PRIVATE_KEY

                  writeFileSync( worker_secrets_path, `${ JSON.stringify( worker_secrets ) }\n`, { mode: 0o600 } )
                  chmodSync( worker_secrets_path, 0o600 )
                  NODE

            - name: Apply D1 migrations
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4.98.0"
                  command: d1 migrations apply ${{ env.D1_DATABASE_NAME }} --remote --config wrangler.generated.jsonc

            - name: Deploy Worker and assets
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4.98.0"
                  command: deploy --config wrangler.generated.jsonc --secrets-file ${{ runner.temp }}/worker-secrets.json

            - name: Clean Worker secrets
              if: always()
              env:
                  WORKER_SECRETS_PATH: ${{ runner.temp }}/worker-secrets.json
              run: rm -f "${WORKER_SECRETS_PATH}"
