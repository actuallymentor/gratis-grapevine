name: Deploy Gratis Grapevine

on:
    push:
        branches:
            - main

env:
    GRAPEVINE_DOMAIN: https://grapevine.gratis.sh
    WEBAUTHN_RP_ID: grapevine.gratis.sh
    WEBAUTHN_RP_NAME: Gratis Grapevine
    GRAPEVINE_SUMMARY_CRON: 0 * * * 1
    GRAPEVINE_TIMEZONE: Europe/Amsterdam
    GRAPEVINE_SUMMARY_LOCAL_HOUR: 9
    GRAPEVINE_SUMMARY_PERIOD_DAYS: 7
    OPENROUTER_SUMMARY_MODEL: openai/gpt-4.1-mini
    OPENROUTER_QUERY_MODEL: openai/gpt-4.1-mini
    OPENROUTER_MAX_INPUT_MESSAGES: 80
    VITE_TRANSCRIPTION_MODEL: onnx-community/whisper-base
    VITE_TRANSCRIPTION_DEVICE: auto
    SESSION_TTL_DAYS: 30
    DATA_RETENTION_POLICY: indefinite
    LOG_LEVEL: info
    D1_DATABASE_NAME: gratis-grapevine
    D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Verify
              run: |
                  npm run lint:check
                  npm test

            - name: Build
              run: npm run build

            - name: Render Wrangler config
              run: npm run deploy:config

            - name: Apply D1 migrations
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: d1 migrations apply ${{ env.D1_DATABASE_NAME }} --remote --config wrangler.generated.jsonc

            - name: Deploy Worker and assets
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --config wrangler.generated.jsonc
